name: Docker build and publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/gost

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate Dockerfile
        run: |
          chmod +x apply-templates.sh

          echo "=== jq ==="
          jq --version

          echo
          echo "=== versions.json ==="
          cat versions.json

          echo
          ./apply-templates.sh

          echo
          echo "=== Generated Dockerfile ==="
          cat Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=test,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64

          # Release tag -> publish to Docker Hub.
          push: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}

          # Manual workflow -> load locally for smoke tests only.
          load: ${{ github.event_name == 'workflow_dispatch' }}

          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        if: github.event_name == 'workflow_dispatch'
        run: |
          IMAGE="${{ env.IMAGE_NAME }}:test"

          echo "=== GOST version ==="
          docker run --rm "$IMAGE" -V

          echo
          echo "=== Runtime user ==="
          docker run --rm \
            --entrypoint sh \
            "$IMAGE" \
            -c '
              echo "uid=$(id -u)"
              echo "gid=$(id -g)"
              echo "home=$HOME"

              test "$(id -u)" = "10001"
              test "$(id -g)" = "10001"
              test "$HOME" = "/var/lib/gost"

              test -r /etc/gost
              test -x /usr/local/bin/gost
              test -w /var/lib/gost

              echo "Non-root runtime checks: OK"
            '

          echo
          echo "=== Image size ==="
          docker image inspect \
            "$IMAGE" \
            --format '{{.Size}} bytes'

          echo
          echo "=== Image user ==="
          docker image inspect \
            "$IMAGE" \
            --format 'User={{.Config.User}}'
